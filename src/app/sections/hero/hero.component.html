<!-- HERO WITH CAROUSEL -->
<section class="hero" id="inicio" [class.tono-claro]="tonoActual() === 'claro'">

  <!-- Carousel Images: cada foto webp en su recorte de celular, tablet o escritorio -->
  <div class="hero-carusel">
    @for (img of images; track img.src; let i = $index) {
      <picture class="carusel-item" [class.active]="i === currentIndex()">
        @if (img.webp) {
          <source media="(max-width: 600px)" [attr.srcset]="img.src + '-celular.webp'" type="image/webp">
          <source media="(max-width: 1100px)" [attr.srcset]="img.src + '-tablet.webp'" type="image/webp">
        }
        <img [src]="img.webp ? img.src + '-escritorio.webp' : img.src" alt=""
             [attr.fetchpriority]="i === 0 ? 'high' : null"
             [style.objectPosition]="segun(img.pos) ?? null">
      </picture>
    }
    <div class="hero-overlay"></div>
  </div>

  <div class="hero-content">
    <p class="hero-script">{{ 'HERO.DISCOVER' | translate }}</p>
    <h1>CERRO KENNEDY</h1>
    <p class="hero-region">{{ 'HERO.REGION' | translate }}</p>
    <p class="hero-tagline">{{ 'HERO.TAGLINE' | translate }}</p>
  </div>

  <!-- Nota manuscrita de la derecha -->
  <div class="hero-note">
    <span>{{ 'HERO.NOTE' | translate }}</span>
  </div>

  <!-- Carousel Indicators (Dots) -->
  <div class="carusel-dots">
    @for (img of images; track img.src; let i = $index) {
      <button type="button" class="dot"
              [class.active]="i === currentIndex()"
              [attr.aria-label]="(i + 1) + ' / ' + images.length"
              (click)="setIndex(i)">
      </button>
    }
  </div>

  <!-- Franja de los cuatro valores, encima de la foto -->
  <app-section-valores class="hero-valores"></app-section-valores>
</section>
